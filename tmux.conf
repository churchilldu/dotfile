# Source MINGW/psmux-specific config (only on Windows/MSYS)
if-shell 'uname -s | grep -qi MINGW' 'source-file ~/.psmux.conf'

# Set the splitting left & right main key.
# Change the symbol in the next next line to change splitting main key
unbind %
bind | split-window -h

# Set the splitting up & down main key.
# Change the symbol in the next next line to change splitting main key
unbind '"'
bind '-' split-window -v

# Set Prefix + r to reload the config.
unbind r
bind r source-file ~/.tmux.conf

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi mode
set-window-option -g mode-keys vi

# Prefix + Space to enter copy mode
unbind Space
bind Space copy-mode

# Set vi mode for copy mode key bindings (recommended for vim users)
setw -g mode-keys vi

# vim-like selection key bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# H / L: start / end of line in copy mode
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line

# renumber windows when a window is closed
set -g renumber-windows on


set -g history-limit 50000

# panes
# set -g pane-border-style 'fg=red'
# set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify center
# set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

# set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

# setw -g window-status-current-style 'fg=black bg=red'
# setw -g window-status-current-format ' #I #W #F '
set -g window-status-current-format "#{window_index}:#{window_name}"

# setw -g window-status-style 'fg=red bg=black'
# setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

# setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
# set -g message-style 'fg=yellow bg=red bold'

# ===========================================
# Appearance
# ===========================================

# Example: Set inactive panes to a dimmed foreground and background color
set-window-option -g window-style 'fg=colour244,bg=colour236'

# Set active window tab to red background with white text
set -g window-status-current-style bg=brightblue,fg=white
