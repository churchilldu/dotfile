# ===========================================
# psmux.conf — MINGW/MSYS + psmux plugins config
# Sourced only on Windows/MSYS via if-shell in tmux.conf
# ===========================================

# Window set shell to git bash (only on Windows/MSYS)
set -g default-shell "C:/Program Files/Git/bin/bash.exe"

# psmux plugins
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @plugin 'psmux-plugins/psmux-pain-control'

# Colors
set -g @prefix_highlight_fg 'white'
set -g @prefix_highlight_bg 'blue'

# Prompt text
set -g @prefix_highlight_prefix_prompt 'Wait'
set -g @prefix_highlight_copy_prompt 'Copy'
set -g @prefix_highlight_sync_prompt 'Sync'

# Toggle indicators
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'

# Initialize PPM (keep at the very bottom)
run '~/.psmux/plugins/ppm/ppm.ps1'
set -g @plugin 'psmux-plugins/psmux-prefix-highlight'
