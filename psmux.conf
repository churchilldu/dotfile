# ===========================================
# psmux.conf — MINGW/MSYS + psmux plugins config
# Sourced only on Windows/MSYS via if-shell in tmux.conf
# ===========================================

# Window set shell to git bash (only on Windows/MSYS)
set -g default-shell "C:/Program Files/Git/bin/bash.exe"

set -g @vim_navigator_mapping_left   'C-h'
set -g @vim_navigator_mapping_down   'C-j'
set -g @vim_navigator_mapping_up     'C-k'
set -g @vim_navigator_mapping_right  'C-l'
set -g @vim_navigator_mapping_prev   'C-\'
set -g @vim_navigator_prefix_mapping_clear_screen 'C-l'
set -g @vim_navigator_pattern '(^|/)g?(view|l?n?vim?x?|fzf)(diff)?(\.exe)?$'
set -g @vim_navigator_poll_interval_ms '250'

# psmux plugins
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @plugin 'psmux-plugins/psmux-prefix-highlight'
set -g @plugin 'psmux-plugins/psmux-vim-navigator'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @plugin 'psmux-plugins/psmux-continuum'

# theme
set -g @plugin 'psmux-plugins/psmux-theme-catppuccin'

# Colors
set -g @prefix_highlight_fg 'white'
set -g @prefix_highlight_bg 'blue'

# Prompt text
set -g @prefix_highlight_prefix_prompt 'Wait'
set -g @prefix_highlight_copy_prompt 'Copy'
set -g @prefix_highlight_sync_prompt 'Sync'

# Toggle indicators
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'

# Save interval in minutes (default: 15, set to 0 to disable)
set -g @continuum-save-interval '15'

# Auto-restore when psmux server starts
set -g @continuum-restore 'on'

# Auto-start psmux on Windows login
set -g @continuum-boot 'on'

# Initialize PPM (keep at the very bottom)
run '~/.psmux/plugins/ppm/ppm.ps1'

# Echo a confirmation every time this file is (re)loaded
# (visible in the status/message area after `prefix + r`)
display-message "psmux.conf reloaded @ #{T:t} (#{session_name})"
