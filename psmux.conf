# psmux config. Self-contained on purpose: it does not source ~/.tmux.conf, so
# the two files have to be kept in sync by hand. The block below mirrors the
# plain-tmux settings in ~/dotfile/tmux.conf.

# Split key
unbind %
bind | split-window -h
bind '\' split-window -h -c '#{pane_current_path}'

unbind '"'
bind '-' split-window -v -c '#{pane_current_path}'
bind '_' split-window -v

# Prefix + r reloads this file. source-file resets the key table in psmux, which
# drops the bindings ppm registers at runtime; the `run ppm.ps1` line at the
# bottom of this file puts them back.
unbind r
bind r source-file ~/.psmux.conf \; display-message 'psmux.conf reloaded'

# Prefix + m to toggle zoom in/out on the current pane
unbind m
bind m resize-pane -Z

# Mouse: click to select pane/window, drag to resize, wheel to scroll
set -g mouse on
set -g extended-keys on

# Vi mode
set-window-option -g mode-keys vi

# Prefix + Space to enter copy mode
unbind Space
bind Space copy-mode

# Set vi mode for copy mode key bindings (recommended for vim users)
setw -g mode-keys vi

# vim-like selection key bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# H / L: start / end of line in copy mode
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line

# less-style half-page scrolling in copy mode
bind -T copy-mode-vi d send-keys -X halfpage-down
bind -T copy-mode-vi u send-keys -X halfpage-up

# renumber windows when a window is closed
set -g renumber-windows on

set -g history-limit 50000

# Window set shell to git bash (only on Windows/MSYS)
set -g default-shell "C:/Program Files/Git/bin/bash.exe"

# vim <-> pane navigation (psmux-vim-navigator)
set -g @vim_navigator_mapping_left  'C-h'
set -g @vim_navigator_mapping_down  'C-j'
set -g @vim_navigator_mapping_up    'C-k'
set -g @vim_navigator_mapping_right 'C-l'
set -g @vim_navigator_mapping_prev  'C-\'
set -g @vim_navigator_prefix_mapping_clear_screen 'C-l'

# psmux-only navigator tweaks: match Windows vim/gvim/fzf executables, poll faster
set -g @vim_navigator_pattern '(^|/)g?(view|l?n?vim?x?|fzf)(diff)?(\.exe)?$'
set -g @vim_navigator_poll_interval_ms '250'

# psmux plugins
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-resurrect'
set -g @plugin 'psmux-plugins/psmux-prefix-highlight'
set -g @plugin 'psmux-plugins/psmux-vim-navigator'
set -g @plugin 'psmux-plugins/psmux-continuum'

# theme
set -g @plugin 'psmux-plugins/psmux-theme-catppuccin'

# session persistence (psmux-resurrect + psmux-continuum)
# Save interval in minutes (default: 15, set to 0 to disable)
set -g @continuum-save-interval '15'

# Auto-restore when psmux server starts
set -g @continuum-restore 'on'

# Auto-start psmux on Windows login
set -g @continuum-boot 'on'

# statusbar
set -g status-position bottom
set -g status-justify centre

set -g window-status-current-format "#{window_index}:#{window_name}"
set -g window-status-current-style bg=brightblue,fg=white

# prefix highlight
set -g @prefix_highlight_fg 'white'
set -g @prefix_highlight_bg 'blue'

set -g @prefix_highlight_prefix_prompt 'Wait'
set -g @prefix_highlight_copy_prompt 'Copy'
set -g @prefix_highlight_sync_prompt 'Sync'

set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'

set -g status-right '#{prefix_highlight} %Y-%m-%d %H:%M '

# Initialize PPM (keep at the very bottom: plugins patch the status-* options
# set above)
run '~/.psmux/plugins/ppm/ppm.ps1'
